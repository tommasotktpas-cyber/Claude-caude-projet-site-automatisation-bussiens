<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon rendez-vous — Lumea</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <header id="site-header"></header>
  <main class="narrow" style="padding-top:40px" id="page"><div class="skeleton" style="height:320px"></div></main>
  <footer id="site-footer"></footer>
  <script src="/js/config.js"></script>
  <script src="/js/common.js"></script>
  <script>
    'use strict';
    mountChrome();
    const token = new URLSearchParams(location.search).get('t');
    let b;
    let resched = { date: null, time: null };

    async function load() {
      try {
        b = await api(`/api/public/bookings/${encodeURIComponent(token || '')}`);
      } catch (err) {
        $('#page').innerHTML = `<div class="empty card"><h2>Rendez-vous introuvable</h2><p>${esc(err.message)}</p><a class="btn" href="/">Accueil</a></div>`;
        return;
      }
      document.documentElement.style.setProperty('--brand', b.accent);
      const st = STATUS[b.status];
      $('#page').innerHTML = `
        <div class="card pad-lg">
          <div class="row between"><span class="badge ${st.cls}">${st.label}</span><a class="small muted" href="/salon.html?s=${encodeURIComponent(b.salon_slug)}">Voir le salon</a></div>
          <h1 style="font-size:2rem;margin:14px 0 4px">${esc(b.service_name)}</h1>
          <p class="muted" style="font-size:1.1rem;margin:0">${fmt.dateTime(b.start_at)}</p>
          <hr class="divider">
          <div class="summary" style="border:0;padding:0">
            <div><span class="muted">Salon</span><b>${esc(b.salon_name)}</b></div>
            <div><span class="muted">Adresse</span><span>${esc(b.address)}, ${esc(b.city)}</span></div>
            <div><span class="muted">Avec</span><span>${esc(b.staff_name)}</span></div>
            <div><span class="muted">Durée</span><span>${fmt.duration(b.duration_min)}</span></div>
            <div><span class="muted">Prix</span><b>${fmt.eur(b.price_cents)}</b></div>
            ${b.deposit_cents ? `<div><span class="muted">Acompte réglé</span><span>${fmt.eur(b.deposit_cents)}</span></div>` : ''}
          </div>
          ${b.status === 'confirmed' ? `
            <div class="row" style="margin-top:22px">
              <a class="btn btn-ghost" href="/api/public/bookings/${encodeURIComponent(token)}/ics">Ajouter à mon agenda</a>
              ${b.can_modify ? '<button class="btn btn-ghost" id="btn-move">Déplacer</button><button class="btn btn-ghost" id="btn-cancel" style="color:var(--danger)">Annuler</button>'
                : `<span class="small muted">Modification en ligne impossible à moins de ${b.cancel_hours} h. Contactez le salon${b.salon_phone ? ` : <a href="tel:${esc(b.salon_phone.replace(/\s/g, ''))}">${esc(b.salon_phone)}</a>` : ''}.</span>`}
            </div>` : ''}
          <div id="move-area"></div>
        </div>
        ${b.can_review ? `
          <div class="card pad-lg" style="margin-top:18px" id="avis">
            <h2 style="font-size:1.4rem">Comment s’est passé votre rendez-vous ?</h2>
            <form id="review-form">
              <div class="row" id="stars" style="gap:4px;font-size:2rem;margin-bottom:10px" role="radiogroup" aria-label="Note">
                ${[1, 2, 3, 4, 5].map((n) => `<button type="button" class="link" style="text-decoration:none;font-size:2rem;color:#d6d0c6" data-star="${n}" aria-label="${n} étoile${n > 1 ? 's' : ''}">★</button>`).join('')}
              </div>
              <textarea name="comment" placeholder="Partagez votre expérience (facultatif)"></textarea>
              <button class="btn btn-brand" style="margin-top:12px">Publier mon avis</button>
            </form>
          </div>` : ''}
        ${b.review_rating ? `<div class="card" style="margin-top:18px"><b>Merci pour votre avis !</b> <span class="stars">${fmt.stars(b.review_rating)}</span></div>` : ''}
        ${b.status === 'cancelled' ? `<div class="center" style="margin-top:22px"><a class="btn btn-brand" href="/salon.html?s=${encodeURIComponent(b.salon_slug)}">Reprendre rendez-vous</a></div>` : ''}`;

      $('#btn-cancel')?.addEventListener('click', async () => {
        const ok = await modal({
          title: 'Annuler ce rendez-vous ?',
          body: `<p>${esc(b.service_name)} — <span>${fmt.dateTime(b.start_at)}</span></p>${b.deposit_cents ? '<p class="muted small">Votre acompte vous sera remboursé.</p>' : ''}`,
          actions: [{ id: 'close', label: 'Garder', cls: 'btn-ghost' }, { id: 'ok', label: 'Oui, annuler', cls: 'btn-danger', handler: () => api(`/api/public/bookings/${encodeURIComponent(token)}/cancel`, { method: 'POST', body: {} }) }],
        });
        if (ok) { toast('Rendez-vous annulé.'); load(); }
      });
      $('#btn-move')?.addEventListener('click', showMove);

      let rating = 0;
      $('#stars')?.addEventListener('click', (e) => {
        const s = e.target.closest('[data-star]');
        if (!s) return;
        rating = Number(s.dataset.star);
        $$('#stars [data-star]').forEach((el) => { el.style.color = Number(el.dataset.star) <= rating ? '#f5a623' : '#d6d0c6'; });
      });
      $('#review-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!rating) return toast('Choisissez une note.', 'error');
        try {
          await api(`/api/public/bookings/${encodeURIComponent(token)}/review`, { method: 'POST', body: { rating, comment: e.target.comment.value } });
          toast('Merci pour votre avis !');
          load();
        } catch (err) { toast(err.message, 'error'); }
      });
      if (location.hash === '#avis') $('#avis')?.scrollIntoView();
    }

    function showMove() {
      const today = new Date().toISOString().slice(0, 10);
      resched = { date: b.start_at.slice(0, 10) < today ? today : b.start_at.slice(0, 10), time: null };
      const days = Array.from({ length: 30 }, (_, i) => dateUtil.addDays(today, i));
      $('#move-area').innerHTML = `<hr class="divider"><h3>Choisir un nouveau créneau</h3>
        <div class="days">${days.map((d) => {
          const dt = new Date(`${d}T12:00:00Z`);
          return `<button class="day ${d === resched.date ? 'selected' : ''}" data-day="${d}"><div class="dow">${dt.toLocaleDateString('fr-FR', { weekday: 'short', timeZone: 'UTC' }).replace('.', '')}</div><div class="num">${dt.getUTCDate()}</div><div class="mon">${dt.toLocaleDateString('fr-FR', { month: 'short', timeZone: 'UTC' }).replace('.', '')}</div></button>`;
        }).join('')}</div><div id="move-slots"></div>`;
      $('#move-area').onclick = async (e) => {
        const d = e.target.closest('[data-day]');
        if (d) { resched.date = d.dataset.day; return loadSlots(); }
        const s = e.target.closest('[data-slot]');
        if (s) {
          try {
            await api(`/api/public/bookings/${encodeURIComponent(token)}/reschedule`, { method: 'POST', body: { date: resched.date, time: s.dataset.slot } });
            toast('Rendez-vous déplacé. Un e-mail de confirmation vous a été envoyé.');
            load();
          } catch (err) { toast(err.message, 'error'); }
        }
      };
      loadSlots();
    }

    async function loadSlots() {
      $$('#move-area .day').forEach((d) => d.classList.toggle('selected', d.dataset.day === resched.date));
      const { slots, reason } = await api(`/api/public/bookings/${encodeURIComponent(token)}/slots?date=${resched.date}`);
      $('#move-slots').innerHTML = slots.length
        ? `<div class="slots" style="margin-top:8px">${slots.map((t) => `<button class="slot" data-slot="${t}">${t.replace(':', 'h')}</button>`).join('')}</div>`
        : `<p class="muted">${esc(reason || 'Aucun créneau ce jour-là.')}</p>`;
    }
    load();
  </script>
</body>
</html>
