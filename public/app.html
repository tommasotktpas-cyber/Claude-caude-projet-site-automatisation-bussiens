<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Espace pro — Lumea</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#18151f">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
  <div class="mobile-top"><button class="icon-btn" id="menu-btn" aria-label="Menu">☰</button><b id="mobile-title">Lumea Pro</b></div>
  <div class="app">
    <nav class="sidebar" id="sidebar" aria-label="Espace pro">
      <a class="logo" href="/app"><span class="logo-mark" aria-hidden="true"></span>Lumea<span class="badge" style="margin-left:4px;background:rgba(255,255,255,.12);color:#fff">Pro</span></a>
      <a href="#dashboard" data-route="dashboard"><span data-icon="home"></span>Tableau de bord</a>
      <a href="#agenda" data-route="agenda"><span data-icon="cal"></span>Agenda</a>
      <a href="#caisse" data-route="caisse"><span data-icon="till"></span>Caisse</a>
      <a href="#stock" data-route="stock"><span data-icon="box"></span>Stock</a>
      <a href="#messages" data-route="messages"><span data-icon="chat"></span>Messages<span class="nav-count" id="msg-count" hidden></span></a>
      <a href="#emails" data-route="emails"><span data-icon="mail"></span>E-mails</a>
      <a href="#clients" data-route="clients"><span data-icon="users"></span>Clients</a>
      <a href="#services" data-route="services"><span data-icon="scissors"></span>Prestations</a>
      <a href="#planning" data-route="planning" data-staff-only hidden><span data-icon="cal"></span>Mes horaires</a>
      <a href="#compta" data-route="compta"><span data-icon="chart"></span>Comptabilité</a>
      <a href="#gains" data-route="gains"><span data-icon="card"></span>Rémunérations</a>
      <a href="#team" data-route="team"><span data-icon="team"></span>Équipe</a>
      <a href="#site" data-route="site"><span data-icon="ext"></span>Mon site</a>
      <a href="#reviews" data-route="reviews"><span data-icon="star"></span>Avis</a>
      <a href="#assistant" data-route="assistant"><span data-icon="phone"></span>Assistant IA</a>
      <a href="#automations" data-route="automations"><span data-icon="bolt"></span>Automatisations</a>
      <a href="#settings" data-route="settings"><span data-icon="cog"></span>Paramètres</a>
      <a href="#billing" data-route="billing"><span data-icon="card"></span>Abonnement</a>
      <div class="bottom">
        <a href="#" id="public-link" target="_blank" rel="noopener"><span data-icon="ext"></span>Page de réservation</a>
        <div style="padding:8px 12px" id="who"></div>
        <a href="#" id="logout">Se déconnecter</a>
      </div>
    </nav>
    <main class="main" id="view"></main>
  </div>
  <script src="/js/config.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/studio-ui.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
