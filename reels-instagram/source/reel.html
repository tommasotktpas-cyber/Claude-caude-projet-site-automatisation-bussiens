const $=s=>document.querySelector(s), $$=(r,s)=>[...r.querySelectorAll(s)];
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const CUR='<svg class="cur" viewBox="0 0 24 24"><path d="M4 2l15 11-6.5 1.2L16 21l-3 1.4-3.4-6.8L4 20z" fill="#fff" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg><div class="ripple"></div>';
const LOCK='<span style="color:#188038">🔒</span>';
const WARN='<span class="warn">⚠ Non sécurisé</span>';
// curseur : liste de points [t,x,y], clics [t]
function cursor(root,c,pts,clicks=[]){
  const cu=root.querySelector('.cur'), rp=root.querySelector('.ripple'); if(!cu)return;
  let x=pts[0][1],y=pts[0][2];
  for(let i=1;i<pts.length;i++){const [t0,x0,y0]=pts[i-1],[t1,x1,y1]=pts[i]; if(c>=t0){const k=eio(seg(c,t0,t1));x=lerp(x0,x1,k);y=lerp(y0,y1,k);}}
  cu.style.left=x+'px';cu.style.top=y+'px';cu.style.opacity=c<pts[0][0]-.2?0:1;
  let r=0,o=0;for(const k of clicks){if(c>=k&&c<k+.45){const p=seg(c,k,k+.45);r=.4+p;o=1-p;}}
  rp.style.left=(x+6)+'px';rp.style.top=(y+6)+'px';rp.style.opacity=o;rp.style.transform=`scale(${r})`;
  cu.style.transform=`scale(${clicks.some(k=>c>=k&&c<k+.12)?.85:1})`;
}

const SALON_PAGE=`<div class="au page"><div class="nav"><div class="logo">Maison Aurèle</div><div>Prestations &nbsp;&nbsp; Équipe &nbsp;&nbsp; Avis &nbsp;&nbsp; <span class="bk">Réserver</span></div></div>

<div class="hero"><h1>${h1}</h1><p>${p}</p><span class="btn">Get Started →</span></div>
<div class="cards">${cards.map(c=>`<div class="card"><div class="e">${c[0]}</div><b>${c[1]}</b>Lorem ipsum dolor sit amet consectetur.</div>`).join('')}</div>
<p class="lorem">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation.</p></div>`;

const V=[
/* 1 */{
 top:'',emoji:'🚨',hook:['Ton site','fait fuir','tes clients'],mark:1,sub:'Regarde la différence ↓',
 ub:WARN+' salon-aurele.lovable.app',ug:LOCK+' maison-aurele.ch',
 bad:AI_PAGE('SalonPro ✨','Welcome to Our Salon 🚀','We provide the best hair solutions for all your needs.',[['⚡','Fast'],['💎','Quality'],['💡','Innovative']])+`<div class="ck" style="position:absolute;left:0;right:0;bottom:-200px;background:#111;color:#fff;padding:24px 30px;font-size:20px;display:flex;justify-content:space-between;align-items:center">🍪 We use cookies to improve your experience. <span style="background:#6d28d9;padding:10px 20px;border-radius:8px">Accept all</span></div>`,
 good:SALON_PAGE,
 stamps:['Amateur','Premium'],punch:'Lequel tu réserves ? 🤔',
 anim(c,B,G){$$(B,'.page')[0].style.transform=`translateY(${-eio(seg(c,1,3.5))*120}px)`;B.querySelector('.ck').style.bottom=lerp(-200,0,eo(seg(c,2,2.5)))+'px';G.querySelector('.page').style.transform=`translateY(${-eio(seg(c,1,5.5))*380}px)`;},
 cq:'Ton site ressemble à celui du haut ?'},
/* 2 */{
 emoji:'⏳',hook:['53 %','des visiteurs','partent'],mark:0,sub:'si ton site met plus de 3 secondes à charger (Google)',

 bad:`<div class="ld" style="position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#888;font-size:26px;gap:20px"><div class="sp" style="width:80px;height:80px;border:9px solid #eee;border-top-color:#888;border-radius:50%"></div>Loading...</div><div class="ct" style="opacity:0">`+AI_PAGE('Restaurant 🍝','Welcome to Our Restaurant','Experience culinary excellence like never before.',[['🍕','Fresh'],['🍷','Wine'],['⭐','Quality']])+`</div>`,
 good:`<div class="ct2" style="opacity:0"><div class="os page"><div class="nav"><div class="logo">Osteria Lume</div><div><span>Carte</span><span>Vins</span><span>Réserver</span></div></div><div class="hero"><div><h1>Pâtes fraîches,<br><em>chaque matin.</em></h1><p style="font-size:21px;opacity:.8;margin-bottom:24px;line-height:1.5">Cuisine italienne de saison, Genève – Plainpalais.<br>Ouvert ce soir jusqu'à 23 h.</p><span class="cta">Réserver une table</span></div><div class="ph ph-f"></div></div></div></div>`,
 timer:true,stamps:['4,6 s 🐢','0,6 s ⚡'],punch:'Chaque seconde = des clients perdus',
 anim(c,B,G){const tb=Math.min(c,4.6), tg=Math.min(c,.6);
  B.querySelector('.sp').style.transform=`rotate(${c*400}deg)`;
  const loaded=c>4.6; B.querySelector('.ld').style.opacity=loaded?0:1; B.querySelector('.ct').style.opacity=loaded?1:0;
  B.querySelector('.ct .page').style.transform=`translateY(${c>5.2?0:60}px)`;

const KC={blue:['#4a3aef','#fff'],dark:['#26262c','#f4f4f6'],light:['#ebe9f5','#26262c']};
const KIN=[
 [.5,'dark','','ton'],[.5,'light','ton','site'],[.5,'blue','est ta','première'],[.5,'dark','','impression.'],
 [.75,'light','fais qu\'elle','compte.','#4a3aef'],[.5,'blue','on','design.'],[.5,'dark','on','code.'],[.5,'light','','rapide.'],
 [.5,'blue','','mobile.'],[.5,'light','','SEO.','#4a3aef'],[.5,'light','','sécurisé.'],[1,'blue','des sites qui','vendent.',null,'grow'],
 [.75,'dark','et qui font','grandir.'],[.75,'light','on en','parle ?'],[1.25,'dark','','écris « SITE »',null,'type'],[2.25,'blue','','',null,'end']];
const KT=KIN.reduce((a,k)=>a+k[0],0);
function buildKin(){
  ['#hook','#cmp','#cta','#bgflash','#top'].forEach(s=>$(s).style.display='none');
  let dots='';const r=rnd(3);for(let i=0;i<26;i++)dots+=`<i style="position:absolute;left:${r()*1080}px;top:${r()*1920}px;width:${3+r()*5}px;height:${3+r()*5}px;border-radius:50%;background:currentColor;opacity:.18" data-v="${(r()-.5)*40}"></i>`;
  document.body.insertAdjacentHTML('beforeend',`<div id="kin" class="layer" style="font-family:Jak;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;letter-spacing:-.045em">${dots}<div id="ks" style="font-weight:800;font-size:96px;line-height:1"></div><div id="kb" style="font-weight:800;line-height:.95;white-space:nowrap"></div><div id="ke" style="font-weight:700;font-size:46px;letter-spacing:-.01em;margin-top:26px"></div></div>`);
}
function renderKin(t){
  let a=0,i=0;for(;i<KIN.length-1;i++){if(t<a+KIN[i][0])break;a+=KIN[i][0];}
  const k=KIN[i],lt=Math.max(0,t-a),[bg,fg]=KC[k[1]],kin=$('#kin');
  kin.style.background=bg;kin.style.color=k[4]||fg;
  const ks=$('#ks'),kb=$('#kb'),ke=$('#ke');let big=k[3];
  if(k[5]==='type'){const n=Math.floor(seg(lt,.05,.9)*big.length);big=big.slice(0,n)+(Math.floor(lt*4)%2?'':'|');}
  if(k[5]==='end'){big='« SITE »';ke.textContent='en DM. On construit ton site dès aujourd\'hui.';ke.style.opacity=seg(lt,.35,.6);}else ke.textContent='';
  ks.textContent=k[5]==='end'?'• écris':k[2];if(kb.dataset.t!==big){kb.textContent=big;kb.dataset.t=big;let s=240;kb.style.fontSize=s+'px';while(kb.scrollWidth>(k[5]==='grow'?850:960)&&s>60){s-=6;kb.style.fontSize=s+'px';}}
  const p=eo(seg(lt,-.04,.1));let sc=lerp(.9,1,p);if(k[5]==='grow'&&lt>.5)sc*=lerp(1,1.12,eo(seg(lt,.5,.62)));
  kb.style.transform=`translateY(${(1-p)*30}px) scale(${sc})`;kb.style.opacity=k[5]==='type'?1:p;
  ks.style.transform=`translateY(${(1-p)*20}px)`;ks.style.opacity=p;

}
